known_combinations:
  - drugs: [*donepezil, *memantine]
    classification: "plausible"
    notes: "FDA-approved fixed-dose combination (Namzaric, Dec 2014) for moderate-severe AD"
  - drugs: [*rivastigmine, *memantine]
    classification: "plausible"
    notes: "ChEI + memantine dual therapy; EFNS-ENS/EAN 2015 guideline, mixed evidence by outcome"
  - drugs: [*galantamine, *memantine]
    classification: "plausible"
    notes: "ChEI + memantine dual therapy; EFNS-ENS/EAN 2015 guideline, mixed evidence by outcome"
  - drugs: [*dextromethorphan, *bupropion]
    classification: "plausible"
    notes: "AXS-05 for AD agitation (ADVANCE-1, ACCORD); bupropion mainly boosts dextromethorphan via CYP2D6"
  - drugs: [*dasatinib, *quercetin]
    classification: "plausible"
    notes: "senolytic combination, phase 1 feasibility trial in mild AD (Gonzales et al., Nat Med 2023; NCT04063124)"
  - drugs: [*losartan, *amlodipine, *atorvastatin]
    classification: "plausible"
    notes: "intensive vascular risk reduction arm of rrAD (NCT02913664); no published efficacy result found"
  - drugs: [*masitinib, *donepezil]
    classification: "plausible"
    notes: "masitinib tested as add-on to ChEI and/or memantine (AB09004, Dubois et al. 2023)"
  - drugs: [*masitinib, *memantine]
